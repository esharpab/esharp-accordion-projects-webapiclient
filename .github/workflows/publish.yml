name: Build and Publish NuGet Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

# nuget.org Trusted Publishing (2026-11-25): no stored API key. The job asks GitHub for an OIDC token, and NuGet/login
# exchanges it for a push key valid for one hour, under the nuget.org policy for this repository and this workflow file
# (publish.yml). NUGET_USER is the nuget.org profile name of the policy's owner (not an e-mail address).
permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore WebApiClient/WebApiClient.csproj

      - name: Restore test dependencies
        run: dotnet restore WebApiClient.Tests/WebApiClient.Tests.csproj

      - name: Build
        run: dotnet build WebApiClient/WebApiClient.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test WebApiClient.Tests/WebApiClient.Tests.csproj --configuration Release --verbosity normal --filter "TestCategory!=Integration&TestCategory!=Performance"

      - name: Pack
        run: dotnet pack WebApiClient/WebApiClient.csproj --configuration Release --no-build --output ./nupkg

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
